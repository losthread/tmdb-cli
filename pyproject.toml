# configs and packaging this app

[project]
name = "tmdb_losthread"
version = "0.0.1"
authors = [{ name="losthread"}]
description = "Fetch movies from the TMDB API"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent"
]
license = { text = "MIT" }
dependencies = [
  "requests",
  "python-dotenv"
]

[project.scripts]
tmdb = "moviefetch.__main__:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moviefetch"]